<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"><!-- header removed --></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section>
        <div class="product-category">
          <a href="product_listing/index.html?category=tents">
            <img src="images/category-tents.svg" alt="Tent Logo">
            <p>Tents</p>
          </a>
          <a href="product_listing/index.html?category=backpacks">
            <img src="images/category-backpacks.svg" alt="Backpack Logo">
            <p>Backpacks</p>
          </a>
          <a href="product_listing/index.html?category=sleeping-bags">
            <img src="images/category-sleepingbags.svg" alt="Sleeping Bag Logo">
            <p>Sleeping Bags</p>
          </a>
          <a href="product_listing/index.html?category=hammocks">
            <img src="images/category-hammocks.svg" alt="Hammock Logo">
            <p>Hammocks</p>
          </a>
        </div>
      </section>

      <section class="products">
        <h2>Top Products</h2>
        <ul class="product-list"></ul>
      </section>
    </main>
    <footer id="main-footer"><!-- footer removed --></footer>
  </body>
</html>
