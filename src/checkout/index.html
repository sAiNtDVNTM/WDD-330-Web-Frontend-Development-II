<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <form action="" method="">
        <h3>Customer Name</h3>
        <div>
          <label for="firstname">First Name</label>
          <input type="text" id="firstname" name="firstname" required>
        </div>
        <div>
          <label for="lastname">Last Name</label>
          <input type="text" id="lastname" name="lastname" required>
        </div>
        <h3>Address</h3>
        <div>
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required>
        </div>
        <div>
          <label for="city">City</label>
          <input type="text" id="city" name="city" required>
        </div>
        <div>
          <label for="state">State</label>
          <input type="text" id="state" name="state" required>
        </div>
        <div>
          <label for="zipcode">Zip Code</label>
          <input type="text" pattern="[0-9]{5}" id="zipcode" name="zipcode" required>
        </div>
        <h3>Payment</h3>
        <div>
          <label for="creditcard">Credit Card Number</label>
          <input type="text" pattern="[0-9]{16}" id="creditcard" name="creditcard" required>
        </div>
        <div>
          <label for="expire">Expiration Date</label>
          <input type="month" id="expire" name="expire" required>
        </div>
        <div>
          <label for="security">Security Code</label>
          <input type="text" pattern="[0-9]{3}" id="security" name="security" required>
        </div>
        <div>
          <button type="submit">Checkout</button>
        </div>
      </form>
      <section>
        <h2>Order Summary</h2>
        <p>Subtotal: <span id="subtotal"></span></p>
        <p>Tax: <span id=""></span></p>
        <p>Shipping Estimate: <span id=""></span></p>
        <p>Order Total: <span id=""></span></p>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
