<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <form id="checkout-form">
        <h3>Customer Name</h3>
        <div>
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required>
        </div>
        <div>
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required>
        </div>
        <h3>Address</h3>
        <div>
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required>
        </div>
        <div>
          <label for="city">City</label>
          <input type="text" id="city" name="city" required>
        </div>
        <div>
          <label for="state">State</label>
          <input type="text" id="state" name="state" required>
        </div>
        <div>
          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" pattern="[0-9]{5}" maxlength="5" inputmode="numeric" autocomplete="postal-code" title="Enter a 5-digit ZIP code." required/>
        </div>
        <h3>Payment</h3>
        <div>
          <label for="cardNumber">Credit Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" pattern="[0-9]{16}" maxlength="16" inputmode="numeric" autocomplete="cc-number" title="Enter 16 digits without spaces." required/>
        </div>
        <div>
          <label for="expiration">Expiration Date</label>
          <input type="month" id="expiration" name="expiration" required>
        </div>
        <div>
          <label for="code">Security Code</label>
          <input type="text" id="code" name="code" pattern="[0-9]{3}" maxlength="3" inputmode="numeric" autocomplete="cc-csc" title="Enter a 3-digit security code." required/>
        </div>
        <div>
          <button type="submit">Checkout</button>
        </div>
      </form>
      <section id="order-summary">
        <h2>Order Summary</h2>
        <p>Subtotal: <span id="subtotal">$0.00</span></p>
        <p>Tax: <span id="tax">Pending ZIP code</span></p>
        <p>Shipping Estimate: <span id="shipping">Pending ZIP code</span></p>
        <p>Order Total: <span id="order-total">Pending ZIP code</span></p>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
